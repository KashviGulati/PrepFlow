services:

  backend:

    build: .

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      GROQ_API_KEY: ${GROQ_API_KEY}

      DB_NAME: prepflow_db
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_HOST: db
      DB_PORT: 5432

    volumes:
      - .:/app

    command: python manage.py runserver 0.0.0.0:8000


  frontend:

    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    command: npm run dev -- --host


  db:

    image: postgres:18

    restart: always

    environment:
      POSTGRES_DB: prepflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


volumes:
  postgres_data: